### SB2040 v2 https://mellow-3d.github.io/fly_sb2040_v2_pins.html

[mcu et0]
canbus_uuid: 3a18ab7be185

[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 20  # an example

[adxl345]
cs_pin: et0:gpio1
spi_software_sclk_pin: et0:gpio0
spi_software_mosi_pin: et0:gpio3
spi_software_miso_pin: et0:gpio2
axes_map: z, y, x

[resonance_tester]
accel_chip: adxl345

# [neopixel et0_neopixel]
# pin: et0:gpio12
# chain_count: 10
# color_order: GRB
# initial_RED: 0.1
# initial_GREEN: 0.0
# initial_BLUE: 0.1


[extruder]
step_pin: et0:gpio9
dir_pin: !et0:gpio10
enable_pin: !et0:gpio7
heater_pin: et0:gpio6


[tmc2209 extruder]
uart_pin: et0:gpio8

[fan] ### Part Cooling Fan
pin: et0:gpio13
[heater_fan hotend_fan]
pin: et0:gpio14
[controller_fan CAN_fan]
pin: et0:gpio15

[probe]
pin: et0:gpio28

[temperature_sensor chamber]
#   One of "EPCOS 100K B57560G104F", "ATC Semitec 104GT-2",
#   "ATC Semitec 104NT-4-R025H42G", "Generic 3950",
#   "Honeywell 100K 135-104LAG-J01", "NTC 100K MGB18-104F39050L32",
#   "SliceEngineering 450", or "TDK NTCG104LH104JT1"
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: et0:gpio27
min_temp: -50
max_temp: 150